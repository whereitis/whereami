name: update

on:
  schedule:
    # 10:30 UTC Tue to Sat: the previous US trading day's close is on FRED by then
    - cron: "30 10 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Fetch sources and append new readings
        run: python3 compute.py update

      - name: Commit data if it changed
        run: |
          git config user.name "whereami update"
          git config user.email "whereami-update@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "no change, nothing committed"
          else
            git commit -m "data: readings through $(python3 -c 'import json;print(json.load(open("docs/data.json"))["last_date"])')"
            git push
          fi
